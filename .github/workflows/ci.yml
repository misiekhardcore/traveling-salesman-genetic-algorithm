name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linting:
    name: Linting
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3.1.2
        with:
          runtime: node@26
          cache: true

      - name: Install node dependencies
        working-directory: ${{ github.workspace}}
        run: pnpm install --frozen-lockfile

      - name: Run linting
        working-directory: ${{ github.workspace }}
        run: pnpm lint

  unit-tests:
    name: Unit tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3.1.2
        with:
          runtime: node@26
          cache: true

      - name: Install node dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: ${{ github.workspace }}
        run: pnpm test --ci --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-report
          path: coverage/

  build:
    name: Build
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3.1.2
        with:
          runtime: node@26
          cache: true

      - name: Install node dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: ${{ github.workspace }}
        run: pnpm build
